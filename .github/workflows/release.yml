name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.3-pre)'
        required: true
        default: 'v0.1.3-pre'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qiE 'pre|rc|alpha|beta'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.prerelease }}" = "true" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/faman-project/faman/internal/app.version=${VERSION}"
          build() {
            local goos=$1 goarch=$2 out=$3
            echo "==> $out"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "$LDFLAGS" -o "dist/$out" ./cmd/faman
          }
          build linux amd64 faman-linux-amd64
          build linux arm64 faman-linux-arm64
          build windows amd64 faman-windows-amd64.exe
          build darwin amd64 faman-darwin-amd64
          build darwin arm64 faman-darwin-arm64

      - name: Package archives
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pack_unix() {
            local name=$1 bin=$2
            local dir="faman-${VERSION}-${name}"
            mkdir -p "dist/pkg/$dir"
            cp "dist/$bin" "dist/pkg/$dir/faman"
            cp -a pages "dist/pkg/$dir/"
            cp README.md LICENSE "dist/pkg/$dir/" 2>/dev/null || true
            if [ -f docs/windows.md ]; then cp docs/windows.md "dist/pkg/$dir/"; fi
            tar -C dist/pkg -czf "dist/${dir}.tar.gz" "$dir"
          }
          pack_unix linux-amd64 faman-linux-amd64
          pack_unix linux-arm64 faman-linux-arm64
          pack_unix darwin-amd64 faman-darwin-amd64
          pack_unix darwin-arm64 faman-darwin-arm64

          dir="faman-${VERSION}-windows-amd64"
          mkdir -p "dist/pkg/$dir"
          cp dist/faman-windows-amd64.exe "dist/pkg/$dir/faman.exe"
          cp -a pages "dist/pkg/$dir/"
          cp README.md LICENSE "dist/pkg/$dir/" 2>/dev/null || true
          cp docs/windows.md "dist/pkg/$dir/" 2>/dev/null || true
          (cd dist/pkg && zip -qr "../${dir}.zip" "$dir")

          (cd dist && sha256sum faman-*.tar.gz faman-*.zip > SHA256SUMS)
          ls -lh dist/faman-*.tar.gz dist/faman-*.zip dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: faman ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## faman ${{ steps.ver.outputs.tag }}

            Pre-built binaries **with** `pages/fa` included.

            | Archive | Platform |
            |---------||----------|
            | `faman-${{ steps.ver.outputs.version }}-linux-amd64.tar.gz` | Linux x86_64 |
            | `faman-${{ steps.ver.outputs.version }}-linux-arm64.tar.gz` | Linux ARM64 |
            | `faman-${{ steps.ver.outputs.version }}-windows-amd64.zip` | Windows x64 |
            | `faman-${{ steps.ver.outputs.version }}-darwin-amd64.tar.gz` | macOS Intel |
            | `faman-${{ steps.ver.outputs.version }}-darwin-arm64.tar.gz` | macOS Apple Silicon |

            ### Linux
            ```bash
            tar -xzf faman-${{ steps.ver.outputs.version }}-linux-amd64.tar.gz
            cd faman-${{ steps.ver.outputs.version }}-linux-amd64
            export FAMAN_PAGES="$PWD/pages/fa"
            ./faman version
            ./faman ls
            ```

            ### Windows
            ```powershell
            Expand-Archive faman-${{ steps.ver.outputs.version }}-windows-amd64.zip
            cd faman-${{ steps.ver.outputs.version }}-windows-amd64
            $env:FAMAN_PAGES = "$PWD\pages\fa"
            .\faman.exe version
            .\faman.exe ls
            ```

            Docs: [windows.md](https://github.com/erfankasraie/Faman/blob/main/docs/windows.md)
          files: |
            dist/faman-*.tar.gz
            dist/faman-*.zip
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
