name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qiE 'pre|rc|alpha|beta'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/faman-project/faman/internal/app.version=${VERSION}"
          build() {
            local goos=$1 goarch=$2 out=$3
            echo "==> $out"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "$LDFLAGS" -o "dist/$out" ./cmd/faman
          }
          build linux amd64 faman-linux-amd64
          build linux arm64 faman-linux-arm64
          build windows amd64 faman-windows-amd64.exe
          build darwin amd64 faman-darwin-amd64
          build darwin arm64 faman-darwin-arm64

      - name: Package archives
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pack_unix() {
            local name=$1 bin=$2
            local dir="faman-${VERSION}-${name}"
            mkdir -p "dist/pkg/$dir"
            cp "dist/$bin" "dist/pkg/$dir/faman"
            cp -a pages "dist/pkg/$dir/"
            cp README.md LICENSE "dist/pkg/$dir/" 2>/dev/null || true
            if [ -f docs/windows.md ]; then cp docs/windows.md "dist/pkg/$dir/"; fi
            tar -C dist/pkg -czf "dist/${dir}.tar.gz" "$dir"
          }
          pack_unix linux-amd64 faman-linux-amd64
          pack_unix linux-arm64 faman-linux-arm64
          pack_unix darwin-amd64 faman-darwin-amd64
          pack_unix darwin-arm64 faman-darwin-arm64

          dir="faman-${VERSION}-windows-amd64"
          mkdir -p "dist/pkg/$dir"
          cp dist/faman-windows-amd64.exe "dist/pkg/$dir/faman.exe"
          cp -a pages "dist/pkg/$dir/"
          cp README.md LICENSE "dist/pkg/$dir/" 2>/dev/null || true
          cp docs/windows.md "dist/pkg/$dir/" 2>/dev/null || true
          (cd dist/pkg && zip -qr "../${dir}.zip" "$dir")

          (cd dist && sha256sum faman-*.tar.gz faman-*.zip > SHA256SUMS)
          ls -lh dist/faman-*.tar.gz dist/faman-*.zip dist/SHA256SUMS

      - name: Write release notes
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cat > dist/RELEASE_NOTES.md <<EOF
          ## faman ${TAG}

          Pre-built binaries **with** \`pages/fa\` included.

          | Archive | Platform |
          |---------|----------|
          | \`faman-${VERSION}-linux-amd64.tar.gz\` | Linux x86_64 |
          | \`faman-${VERSION}-linux-arm64.tar.gz\` | Linux ARM64 |
          | \`faman-${VERSION}-windows-amd64.zip\` | Windows x64 |
          | \`faman-${VERSION}-darwin-amd64.tar.gz\` | macOS Intel |
          | \`faman-${VERSION}-darwin-arm64.tar.gz\` | macOS Apple Silicon |

          ### Linux
          \`\`\`bash
          tar -xzf faman-${VERSION}-linux-amd64.tar.gz
          cd faman-${VERSION}-linux-amd64
          export FAMAN_PAGES="\$PWD/pages/fa"
          ./faman version
          ./faman ls
          \`\`\`

          ### Windows
          \`\`\`powershell
          Expand-Archive faman-${VERSION}-windows-amd64.zip
          cd faman-${VERSION}-windows-amd64
          \$env:FAMAN_PAGES = "\$PWD\\pages\\fa"
          .\\faman.exe version
          .\\faman.exe ls
          \`\`\`

          Docs: [windows.md](https://github.com/erfankasraie/Faman/blob/main/docs/windows.md) · [packaging.md](https://github.com/erfankasraie/Faman/blob/main/docs/packaging.md)
          EOF

      # Immutable releases: attach ALL assets while still a draft, then publish once.
      - name: Create draft release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          set -euo pipefail
          # If a broken/partial release exists for this tag, remove it (keep git tag).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release $TAG found — deleting so assets can be re-attached"
            gh release delete "$TAG" -y || true
          fi

          EXTRA=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA+=(--prerelease)
          fi

          # Ensure tag exists on remote when using workflow_dispatch without a push tag
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" || true
          fi
          git push origin "refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" \
            --title "faman $TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            --draft \
            "${EXTRA[@]}" \
            dist/faman-*.tar.gz \
            dist/faman-*.zip \
            dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          gh release view "$TAG" --json isDraft,isPrerelease,url,releaseAssets --jq '{url, isDraft, isPrerelease, assets: [.releaseAssets[].name]}'
