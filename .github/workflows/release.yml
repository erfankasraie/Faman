name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must be NEW if previous was immutable, e.g. v0.2.1)'
        required: true
        default: 'v0.2.1'
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$TAG" | grep -qiE 'pre|rc|alpha|beta'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prerelease }}" = "true" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check existing release (immutable-safe)
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No existing release for $TAG"
            exit 0
          fi

          META=$(gh release view "$TAG" --json isDraft,isImmutable,url,assets \
            --jq '{isDraft, isImmutable, url, n: (.assets|length)}')
          echo "$META"
          IS_DRAFT=$(echo "$META" | jq -r .isDraft)
          N=$(echo "$META" | jq -r .n)

          if [ "$IS_DRAFT" = "true" ]; then
            echo "Draft release found — deleting draft only"
            gh release delete "$TAG" -y
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$N" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already published with $N assets (immutable). Skipping rebuild."
            gh release view "$TAG" --json url,isDraft,isPrerelease,assets \
              --jq '{url, isDraft, isPrerelease, assets: [.assets[].name]}'
            exit 0
          fi

          # Published immutable release without assets — cannot re-attach
          echo "::error::Tag $TAG was already used by an immutable release without usable assets."
          echo "::error::GitHub forbids reusing that tag_name. Bump the version (e.g. v0.2.1) and run again."
          exit 1

      - name: Build binaries
        if: steps.existing.outputs.skip_build != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X github.com/faman-project/faman/internal/app.version=${VERSION}"
          build() {
            local goos=$1 goarch=$2 out=$3
            echo "==> $out"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "$LDFLAGS" -o "dist/$out" ./cmd/faman
          }
          build linux amd64 faman-linux-amd64
          build linux arm64 faman-linux-arm64
          build windows amd64 faman-windows-amd64.exe
          build darwin amd64 faman-darwin-amd64
          build darwin arm64 faman-darwin-arm64

      - name: Package archives
        if: steps.existing.outputs.skip_build != 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pack_unix() {
            local name=$1 bin=$2
            local dir="faman-${VERSION}-${name}"
            mkdir -p "dist/pkg/$dir"
            cp "dist/$bin" "dist/pkg/$dir/faman"
            cp -a pages "dist/pkg/$dir/"
            cp README.md LICENSE "dist/pkg/$dir/" 2>/dev/null || true
            if [ -f docs/windows.md ]; then cp docs/windows.md "dist/pkg/$dir/"; fi
            tar -C dist/pkg -czf "dist/${dir}.tar.gz" "$dir"
          }
          pack_unix linux-amd64 faman-linux-amd64
          pack_unix linux-arm64 faman-linux-arm64
          pack_unix darwin-amd64 faman-darwin-amd64
          pack_unix darwin-arm64 faman-darwin-arm64

          dir="faman-${VERSION}-windows-amd64"
          mkdir -p "dist/pkg/$dir"
          cp dist/faman-windows-amd64.exe "dist/pkg/$dir/faman.exe"
          cp -a pages "dist/pkg/$dir/"
          cp README.md LICENSE "dist/pkg/$dir/" 2>/dev/null || true
          cp docs/windows.md "dist/pkg/$dir/" 2>/dev/null || true
          (cd dist/pkg && zip -qr "../${dir}.zip" "$dir")

          (cd dist && sha256sum faman-*.tar.gz faman-*.zip > SHA256SUMS)
          ls -lh dist/faman-*.tar.gz dist/faman-*.zip dist/SHA256SUMS

      - name: Write release notes
        if: steps.existing.outputs.skip_build != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          cat > dist/RELEASE_NOTES.md <<EOF
          ## faman ${TAG}

          Pre-built binaries **with** \`pages/fa\` included.

          | Archive | Platform |
          |---------|----------|
          | \`faman-${VERSION}-linux-amd64.tar.gz\` | Linux x86_64 |
          | \`faman-${VERSION}-linux-arm64.tar.gz\` | Linux ARM64 |
          | \`faman-${VERSION}-windows-amd64.zip\` | Windows x64 |
          | \`faman-${VERSION}-darwin-amd64.tar.gz\` | macOS Intel |
          | \`faman-${VERSION}-darwin-arm64.tar.gz\` | macOS Apple Silicon |

          ### Linux
          \`\`\`bash
          tar -xzf faman-${VERSION}-linux-amd64.tar.gz
          cd faman-${VERSION}-linux-amd64
          export FAMAN_PAGES="\$PWD/pages/fa"
          ./faman version
          ./faman ls
          \`\`\`

          ### Windows
          \`\`\`powershell
          Expand-Archive faman-${VERSION}-windows-amd64.zip
          cd faman-${VERSION}-windows-amd64
          \$env:FAMAN_PAGES = "\$PWD\\pages\\fa"
          .\\faman.exe version
          .\\faman.exe ls
          \`\`\`

          Verify: \`sha256sum -c SHA256SUMS --ignore-missing\`

          Docs: [windows.md](https://github.com/erfankasraie/Faman/blob/main/docs/windows.md) · [packaging.md](https://github.com/erfankasraie/Faman/blob/main/docs/packaging.md)
          EOF

      - name: Create draft release with all assets
        if: steps.existing.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA+=(--prerelease)
          fi

          # Tag must already exist on the remote for immutable / restricted repos.
          # Prefer: git tag + git push origin vX.Y.Z from your machine, then run workflow.
          if ! git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
            echo "::error::Git tag $TAG does not exist on origin."
            echo "::error::Create it locally and push, then re-run:"
            echo "::error::  git tag -a $TAG -m 'faman $TAG' && git push origin $TAG"
            exit 1
          fi

          gh release create "$TAG" \
            --title "faman $TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            --draft \
            --target "${{ github.sha }}" \
            "${EXTRA[@]}" \
            dist/faman-*.tar.gz \
            dist/faman-*.zip \
            dist/SHA256SUMS

      - name: Publish release
        if: steps.existing.outputs.skip_build != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ steps.ver.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          gh release view "$TAG" --json isDraft,isPrerelease,url,assets \
            --jq '{url, isDraft, isPrerelease, assets: [.assets[].name]}'
